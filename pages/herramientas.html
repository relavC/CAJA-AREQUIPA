<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEJ Partners | Herramientas</title>
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <script type="module" src="../assets/js/pages/herramientas.js"></script>
</head>
<body class="tools-page">

  <!-- ============ HEADER ============ -->
  <header class="header" data-header>
    <div class="container header__inner">
      <a href="../index.html" class="logo" aria-label="SEJ Partners inicio">
        <img src="../assets/img/logo-sej.png" alt="SEJ Partners S.A.C." class="logo__img" />
      </a>

      <nav class="nav" id="mainNav" data-nav aria-label="Menú principal">
        <ul class="nav__list">
          <li class="nav__item"><a href="../index.html" class="nav__link"><i class="ri-home-4-line"></i> Inicio</a></li>
          <li class="nav__item"><a href="herramientas.html" class="nav__link is-current" aria-current="page"><i class="ri-tools-line"></i> Herramientas</a></li>
          <li class="nav__item"><a href="login.html" class="nav__link"><i class="ri-dashboard-line"></i> Dashboard</a></li>
        </ul>
      </nav>

      <button class="burger" data-burger aria-label="Abrir menú" aria-controls="mainNav" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>
  <div class="overlay" data-overlay></div>

  <main class="tools">
    <div class="container tools__inner">
      <header class="tools__head">
        <span class="tools__tag"><i class="ri-file-edit-line"></i> Herramientas</span>
        <h1>Registro de prospecciones</h1>
        <p>Formulario para supervisores de venta. La fecha y hora se guardan automáticamente al registrar.</p>
      </header>

      <form class="tool-form" data-tool-form novalidate>
        <fieldset>
          <legend><i class="ri-user-star-line"></i> Supervisor y asesor</legend>
          <div class="tool-form__grid">
            <label class="control">
              <span>Supervisor de venta (SDV) *</span>
              <select name="supervisor" required data-select-supervisores>
                <option value="">Selecciona tu nombre</option>
              </select>
            </label>
            <label class="control">
              <span>DNI_Asesor *</span>
              <input type="text" name="dni_asesor" required inputmode="numeric" pattern="\d{8}" maxlength="8" autocomplete="off" placeholder="Solo números (8 dígitos)" data-solo-numeros />
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend><i class="ri-user-line"></i> Cliente y monto</legend>
          <div class="tool-form__grid">
            <label class="control">
              <span>DNI del cliente *</span>
              <input type="text" name="dni_cliente" required inputmode="numeric" pattern="\d{8}" maxlength="8" autocomplete="off" placeholder="Solo números (8 dígitos)" data-solo-numeros />
            </label>
            <label class="control">
              <span>Monto (S/) *</span>
              <div class="input-prefix">
                <span>S/</span>
                <input type="number" name="monto" required min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" />
              </div>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend><i class="ri-map-pin-2-line"></i> Agencia y analista</legend>
          <div class="tool-form__grid">
            <label class="control">
              <span>Agencia *</span>
              <select name="agencia" required data-select-agencias>
                <option value="">Selecciona la agencia</option>
              </select>
            </label>
            <label class="control">
              <span>Analista asignado *</span>
              <input type="text" name="analista" required maxlength="120" placeholder="Nombre del analista" />
            </label>
          </div>
          <label class="control tool-form__full">
            <span>Comentario *</span>
            <textarea name="comentario" rows="3" required maxlength="1000" placeholder="Comentario sobre la prospección..."></textarea>
          </label>
        </fieldset>

        <p class="tool-form__stamp"><i class="ri-time-line"></i> Fecha y hora de registro: <b data-reloj></b></p>

        <p class="alert alert--bad" data-form-error role="alert" hidden></p>

        <div class="tool-form__actions">
          <button type="reset" class="btn btn--ghost"><i class="ri-eraser-line"></i> Limpiar</button>
          <button type="submit" class="btn btn--primary"><i class="ri-save-3-line"></i> Registrar</button>
        </div>
      </form>

      <p class="alert alert--ok" data-form-ok role="status" hidden></p>

    </div>
  </main>
</body>
</html>
